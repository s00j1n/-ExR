<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Evan × Rebet | Archive</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-light: #f0f7ff;         
    --bg-accent: #badfdb;         
    --env-bg: #ffffff;            
    --env-border: #f3e8ff;        
    --paper-bg: #ffffff;          
    --text-primary: #222226;      
    --text-secondary: #625d73;    
    --text-muted: #8d85a3;        
    --accent-color: #3b82f6;      
    --border-color: #fce7f3;      
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
  
  /* 🚫 스크롤바 완전 차단 및 뷰포트 고정 */
  html, body { 
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: fixed;
  }

  body {
    background: radial-gradient(circle at 50% 30%, var(--bg-accent) 0%, var(--bg-light) 100%);
    color: var(--text-primary);
    font-family: "Pretendard Variable", -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    user-select: none;
    perspective: 1500px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 580px;
    height: 100%;
    max-height: 820px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ✉️ 카드 홀더 */
  .envelope-wrapper {
    position: absolute;
    width: 100%;
    max-width: 420px;
    height: 280px;
    background: var(--env-bg);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 25px 50px rgba(59, 130, 246, 0.12), 
                0 10px 20px rgba(0, 0, 0, 0.04);
    cursor: pointer;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 32px;
    transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease 0.4s;
  }

  .envelope-wrapper:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 30px 60px rgba(59, 130, 246, 0.2), 
                0 15px 25px rgba(0, 0, 0, 0.06);
  }

  .env-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .env-label {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  .env-badge {
    width: 32px;
    height: 32px;
    background: var(--bg-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    color: var(--accent-color);
  }

  .env-center {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .env-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .env-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--accent-color);
    letter-spacing: 1px;
  }

  .env-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #f1f5f9;
    padding-top: 16px;
  }

  .env-action {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .env-action span {
    font-size: 1rem;
    transition: transform 0.3s ease;
  }

  .envelope-wrapper:hover .env-action span {
    transform: translateX(4px);
  }

  .env-from {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* 오픈 시 애니메이션 */
  .stage.open .envelope-wrapper {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.9);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  /* 📜 서약서 본문 */
  .canvas {
    width: 100%;
    height: 100%;
    background: var(--paper-bg);
    padding: 32px 36px;
    border-radius: 16px;
    box-shadow: 0 30px 80px rgba(59, 130, 246, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 5;
    
    opacity: 0;
    transform: translateY(180px) scale(0.85);
    pointer-events: none;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease 0.2s;
  }

  .stage.open .canvas {
    z-index: 30;
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
    transition-delay: 0.2s;
  }

  /* 🎵 사운드 버튼 겹침 방지 배치 */
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    margin-bottom: -10px;
  }

  .bgm-tag {
    background: #f8fafc;
    border: 1px solid var(--border-color);
    padding: 4px 10px;
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .bgm-tag:hover { 
    color: var(--accent-color); 
    border-color: var(--accent-color);
  }

  .header-zone {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sub-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--accent-color);
    letter-spacing: 3px;
    font-weight: 600;
  }
  .main-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  /* ⏱️ 타이머 박스 */
  .timer-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 20px;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    width: 100%;
    max-width: 300px;
  }
  .dday-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent-color);
    letter-spacing: 1px;
    font-style: italic;
  }
  .timer-value {
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    font-family: 'Cormorant Garamond', serif;
  }
  .timer-date {
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .profile-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    align-items: center;
  }

  .profile-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .image-wrapper {
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 190px;
    background-color: #f8fafc;
    overflow: hidden;
    position: relative;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.08);
  }
  .image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .profile-item:hover .image-wrapper img {
    transform: scale(1.04);
  }

  .caption-box {
    margin-top: 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .char-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }
  .char-quote {
    font-size: 0.72rem;
    color: var(--text-secondary);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.2px;
  }

  .footer-zone {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
  }
  .statement {
    font-size: 0.75rem;
    color: var(--text-secondary);
    letter-spacing: -0.2px;
    text-align: center;
  }
  .signature-group {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .sign-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 400;
    letter-spacing: 1px;
  }
  .stamp {
    width: 28px;
    height: 28px;
    border: 1.5px solid #f43f5e;
    color: #f43f5e;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    font-weight: 600;
    font-family: 'Noto Serif KR', serif;
    transform: rotate(-10deg);
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 1.2rem;
    animation: sparkle-anim 0.8s linear forwards;
    z-index: 9999;
  }

  @keyframes sparkle-anim {
    0% {
      transform: translate(0, 0) scale(0.5) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(180deg);
      opacity: 0;
    }
  }

  /* 📱 모바일 세로 화면 최적화 */
  @media (max-width: 550px) {
    body {
      padding: 10px;
    }
    .canvas { 
      padding: 18px 14px; 
    }
    .main-title { 
      font-size: 1.2rem; 
    }
    .sub-title {
      font-size: 0.85rem;
    }
    .image-wrapper {
      max-height: 140px;
    }
    .char-name {
      font-size: 1.1rem;
    }
    .char-quote {
      font-size: 0.66rem;
    }
    .envelope-wrapper { 
      max-width: 100%; 
      height: 240px; 
      padding: 20px; 
    }
  }
</style>
</head>
<body>

<!-- 🎵 유튜브 백그라운드 오디오 -->
<div style="display:none;">
  <div id="youtubeBgm"></div>
</div>

<div class="stage" id="stage">

  <!-- ✉️ 카드 홀더 -->
  <div class="envelope-wrapper" onclick="openEnvelope(event)">
    <div class="env-top">
      <span class="env-label">Archive</span>
      <div class="env-badge">♥</div>
    </div>
    <div class="env-center">
      <div class="env-title">무기한 계약연애 서약서</div>
      <div class="env-sub">Evan × Rebet</div>
    </div>
    <div class="env-bottom">
      <span class="env-from">From. you</span>
      <div class="env-action">Open <span>→</span></div>
    </div>
  </div>

  <!-- 📜 서약서 본문 -->
  <div class="canvas">

    <!-- 상단 바 (사운드 버튼 분리) -->
    <div class="top-bar">
      <button class="bgm-tag" id="bgmToggle">Sound On</button>
    </div>

    <!-- 헤더 -->
    <div class="header-zone">
      <span class="sub-title">Contract of Agreement</span>
      <h1 class="main-title">무기한 계약연애 서약서</h1>
    </div>

    <!-- ⏱️ 타이머 -->
    <div class="timer-box">
      <div class="dday-value" id="ddayText">Day 01</div>
      <div class="timer-value" id="timer">00 : 00 : 00</div>
      <div class="timer-date" id="timerDate">SINCE 2026. 09. 18</div>
    </div>

    <!-- 이미지 섹션 -->
    <div class="profile-grid">

      <!-- Evan -->
      <div class="profile-item">
        <div class="image-wrapper">
          <img src="photo_evan.jpg" alt="Evan Photo">
        </div>
        <div class="caption-box">
          <div class="char-name">Evan</div>
          <div class="char-quote">" 빌런은 너를 위해 세계를 버리고. "</div>
        </div>
      </div>

      <!-- Rebet -->
      <div class="profile-item">
        <div class="image-wrapper">
          <img src="photo_rebet.jpg" alt="Rebet Photo">
        </div>
        <div class="caption-box">
          <div class="char-name">Rebet</div>
          <div class="char-quote">" 히어로는 세계를 위해 자신을 버려. "</div>
        </div>
      </div>

    </div>

    <!-- 서명 -->
    <div class="footer-zone">
      <p class="statement">위 두 사람의 관계가 무기한 유효함을 서약합니다.</p>
      <div class="signature-group">
        <span class="sign-name">Evan</span>
        <div class="stamp">서약</div>
        <span class="sign-name">Rebet</span>
      </div>
    </div>

  </div>

</div>

<!-- 유튜브 IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;
  let bgmState = true;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('youtubeBgm', {
      height: '0',
      width: '0',
      videoId: '7YHDKxYsQ7s',
      playerVars: {
        'autoplay': 0,
        'loop': 1,
        'playlist': '7YHDKxYsQ7s'
      }
    });
  }

  function createSparkle(e) {
    const symbols = ['💖'];
    const x = e.clientX;
    const y = e.clientY;

    for (let i = 0; i < 3; i++) {
      const span = document.createElement('span');
      span.className = 'sparkle';
      span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 30 + Math.random() * 50;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;

      span.style.left = `${x}px`;
      span.style.top = `${y}px`;
      span.style.setProperty('--tx', `${tx}px`);
      span.style.setProperty('--ty', `${ty}px`);

      document.body.appendChild(span);
      setTimeout(() => span.remove(), 800);
    }
  }

  window.addEventListener('click', function(e) {
    createSparkle(e);
  });

  function openEnvelope(e) {
    const stage = document.getElementById('stage');
    if (!stage.classList.contains('open')) {
      stage.classList.add('open');
      
      if (player && typeof player.playVideo === 'function' && bgmState) {
        player.playVideo();
      }
    }
  }

  function initTimer() {
    const year = 2026;
    const month = 8; // 9월
    const day = 18;
    const hour = 17;
    const minute = 0;
    const second = 0;

    const startTime = new Date(year, month, day, hour, minute, second).getTime();

    function updateTimer() {
      const now = Date.now();
      const diff = now - startTime;

      if (diff < 0) {
        document.getElementById('ddayText').innerText = "Day 01";
        document.getElementById('timer').innerText = "00 : 00 : 00";
        return;
      }

      const totalSecs = Math.floor(diff / 1000);
      const days = Math.floor(totalSecs / (60 * 60 * 24)) + 1;
      
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      const pad = (n) => String(n).padStart(2, '0');

      document.getElementById('ddayText').innerText = `Day ${days}`;
      document.getElementById('timer').innerText = `${pad(hours)} : ${pad(mins)} : ${pad(secs)}`;
      document.getElementById('timerDate').innerText = `SINCE ${year}. ${String(month + 1).padStart(2, '0')}. ${String(day).padStart(2, '0')}`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  }

  initTimer();

  document.getElementById('bgmToggle').addEventListener('click', function(e) {
    e.stopPropagation();
    bgmState = !bgmState;
    
    if (bgmState) {
      this.innerText = "Sound On";
      if (player && typeof player.playVideo === 'function') {
        player.playVideo();
      }
    } else {
      this.innerText = "Sound Off";
      if (player && typeof player.pauseVideo === 'function') {
        player.pauseVideo();
      }
    }
  });
</script>

</body>
</html>
